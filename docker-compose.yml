services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - SNU_DB=/data/snu.db
      - SNU_TIMETABLE_AUTO_APPLY=true
    volumes:
      - snu-db:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  snu-db:
