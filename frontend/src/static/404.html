<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — SNU Scheduler</title>
<style>
:root{--ink:#0D1115;--s1:#151B21;--tx:#E7EAED;--dim:#94A4B1;--sig:#E9A13B}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;
     display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{max-width:440px}
.code{font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--sig);font-size:13px;
      letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
h1{font-size:26px;margin:0 0 10px;font-weight:700}
p{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 22px}
a.btn{display:inline-block;background:var(--sig);color:#1a1200;font-weight:600;text-decoration:none;
      padding:10px 20px;border-radius:8px;font-size:13.5px}
a.btn:hover{opacity:.9}
</style>
</head>
<body>
<div class="card">
  <div class="code">404 — not found</div>
  <h1>That page doesn't exist</h1>
  <p>This is a single-page planning tool — everything lives at one address.
     The link you followed may be old or mistyped.</p>
  <a class="btn" href="/">Back to the scheduler</a>
</div>
</body>
</html>
