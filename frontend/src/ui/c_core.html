</div><script>
const C = __DATA__;                       // course catalogue with packages
const BY={}; C.forEach(c=>BY[c.code]=c);
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const f1=n=>(Math.round(n*10)/10);
function hm(m){const h=Math.floor(m/60),q=m%60,ap=h>=12?'PM':'AM';let x=h%12;if(!x)x=12;
  return x+':'+String(q).padStart(2,'0')+' '+ap;}
/* term overlap: two half-semester terms in opposite halves never collide */
function tOv(a,b){ if(a===b) return true; return a==='Full semester'||b==='Full semester'; }
/* meeting = [day, start, end, comp, sec, room] */
function mOv(a,b,ta,tb){ return a[0]===b[0] && tOv(ta,tb) && a[1]<b[2] && b[1]<a[2]; }

/* ---------- state ---------- */
let FIXED=[];       // [{code,pkg}]  pre-enrolled, not biddable
let MANUAL=[];      // [{name,cr}]   off-timetable credit (project, SWAYAM)
let PICK={};        // code -> {want, pkg}
let BUD={ME:0,UWE:0,CCC:0};
let LAST=null;
let DONE_ME=[];     // [{code,name,cr}] already-completed major electives, for
                     // specialisation-bucket credit banking -- empty by default,
                     // filled in per-student and saved locally (see plans.js)
let CHOICE_GROUPS=[]; // [{kind, members:[code,...], min_credits, label}] for the
                       // wishlist scheduler (see app/services/cp_scheduler.py) --
                       // members must be codes currently in PICK.
let ADVISEMENT_INFO=null; // private, local-only report provenance; never shipped as a default

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); $('p-'+t.dataset.p).classList.add('on');
  if(t.dataset.p==='courses') drawTT();
  if(t.dataset.p==='two'){ drawTwo(); drawSpec(); }
  if(t.dataset.p==='rules') drawRules();
  if(t.dataset.p==='learn') drawLearn();
  if(t.dataset.p==='bid'&&typeof RESULT!=='undefined'&&RESULT&&RESULT.recommendations) void stressPlan();
});

/* ============ BUDGET ============ */
const SEMS={y4:[7],y3:[5,6,7],y2:[2,3,4,5,6,7]};
const UREL={2:.15,3:.20,4:.20,5:.20,6:.15,7:.10}, MREL={2:.075,3:.175,4:.20,5:.20,6:.20,7:.15};
function refreshSem(){const m=$('model').value,s=$('sem');s.innerHTML='';
  SEMS[m].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent='Semester '+v;s.appendChild(o);});
  if(m==='y3')s.value=5;}
$('model').onchange=()=>{refreshSem();recalc();};refreshSem();

function recalc(){
  // Offline fallback only: refreshPoolsFromBackend() (glue.js) overwrites BUD from the
  // authoritative POST /api/v1/pools call whenever the backend is reachable. This client
  // copy exists purely so the page renders something before that call resolves, or if the
  // backend is genuinely unreachable — it must stay in sync with app/domain/pools.py.
  const m=$('model').value, sem=+$('sem').value;
  const rM=+$('remME').value||0,rU=+$('remUWE').value||0,rC=+$('remCCC').value||0,fl=+$('remFL').value||0;
  const dM=+($('doneME')?$('doneME').value:0)||0,dU=+($('doneUWE')?$('doneUWE').value:0)||0,
        dC=+($('doneCCC')?$('doneCCC').value:0)||0;
  const eU=rU+fl/2, eC=rC+fl/2; let f='';
  if(m==='y4'){ BUD={ME:Math.round(rM*15+162),UWE:Math.round(eU*15+110),CCC:Math.round(eC*30+72)};
    f='Fourth-year model — ME = remaining×15 + 162 · UWE = (remaining + ½ floater)×15 + 110 · CCC = (remaining + ½ floater)×30 + 72.';
  } else if(m==='y3'){ const sh={5:.40,6:.30,7:.30}[sem];
    BUD={ME:Math.round(rM*10*sh+65),UWE:Math.round(eU*10*sh+50),CCC:Math.round(eC*10*sh+30)};
    f=`Third-year transition, Sem ${sem} — credit part at ${Math.round(sh*100)}% of (remaining×10) plus the full constant each semester.`;
  } else {
    // POOL.Y2 (rectified 2026-08-05): release is a fraction of the TOTAL category
    // requirement (remaining + already-completed), not of "remaining" alone, then 5
    // points are deducted per completed credit. See app/domain/pools.py's own comment
    // for the worked-example derivation (55 = 30 + 40 - 15 for UWE).
    const totM=rM+dM, totU=eU+dU, totC=eC+dC;
    let a=0,b=0,c2=0;
    for(let s=2;s<=sem;s++){a+=totM*10*(MREL[s]||0);b+=totU*10*(UREL[s]||0);c2+=totC*10*(MREL[s]||0);}
    a-=dM*5; b-=dU*5; c2-=dC*5;
    BUD={ME:Math.round(Math.max(0,a)),UWE:Math.round(Math.max(0,b)),CCC:Math.round(Math.max(0,c2))};
    f=`Steady state — 10 points per credit of the category's total requirement, released on the staggered `
     +`schedule and accumulated to Sem ${sem}, minus 5 points per already-completed credit.`;}
  $('bME').textContent=BUD.ME;$('bUWE').textContent=BUD.UWE;$('bCCC').textContent=BUD.CCC;
  $('fME').textContent =`${BUD.ME} points available — no per-course cap`;
  $('fUWE').textContent=`${BUD.UWE} points available — no per-course cap`;
  $('fCCC').textContent=`${BUD.CCC} points available — no per-course cap`;
  $('formula').textContent=f;
  budFlags(); posFlags(); renderChosen(); drawTwo(); if(typeof drawSpec==='function') drawSpec();
}
['remME','remUWE','remCCC','remFL','doneME','doneUWE','doneCCC','capCr','sem','doneCr','degCr','remCore','remOther']
  .forEach(id=>{const e=$(id); if(e) e.addEventListener('change',recalc);});

function budFlags(){
  let h=`<div class="flag f-ok"><b>There is no per-course bid cap.</b>
   You may bid any whole number from zero up to your entire available pool for that category on a single
   course (rectified 2026-08-05). With ${BUD.ME} ME points you could commit all of it to one elective if you
   chose to. Points bid are held against your category's live balance while a round is open and released back
   if the bid loses (confirmed official rule, BUDGET.SHARED_LIVE — see the Rules tab), so simultaneous bids in
   the same category are a real tradeoff, not independent budgets.</div>`;
  h+=`<div class="flag f-q"><b>Your inputs control this estimate.</b> Remaining-credit values come from
   your local profile. Run the degree audit against your selected programme before relying on the pool,
   especially when a course may satisfy more than one published minimum.</div>`;
  $('budFlags').innerHTML=h;
}
function fixedCredits(){
  let t=0; FIXED.forEach(f=>t+=(BY[f.code]?BY[f.code].cr:0)); MANUAL.forEach(m=>t+=m.cr); return t;
}
function posFlags(){
  const cap=+$('capCr').value||25, fx=fixedCredits();
  const room=Math.max(0,cap-fx), chosen=Object.keys(PICK).reduce((n,code)=>n+(BY[code]?BY[code].cr:0),0);
  let h=`<div class="flag ${chosen>room?'f-bad':'f-ok'}"><b>Credit-ceiling check.</b>
   Your fixed load is <span class="mono">${f1(fx)}</span> credits, leaving
   <span class="mono">${f1(room)}</span> credits under the ${f1(cap)}-credit ceiling.
   The current picker contains <span class="mono">${f1(chosen)}</span> additional credits.</div>`;
  h+=`<div class="flag f-q"><b>Degree impact is programme-specific.</b> Use “Run audit check” to see which
   published requirements the selected courses would satisfy. A selected course is always shown as planned,
   never silently recorded as completed.</div>`;
  $('posFlags').innerHTML=h;
}
