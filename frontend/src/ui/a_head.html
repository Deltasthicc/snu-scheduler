<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNU Bid &amp; Schedule Simulator — Monsoon 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0D1115;--s1:#151B21;--s2:#1D242B;--s3:#263039;--line:#293views;--line:#29333C;--line2:#3B4855;
--tx:#E7EAED;--dim:#94A4B1;--faint:#93A1AD;--sig:#E9A13B;--sigbg:rgba(233,161,59,.10);
--ok:#5CBCA6;--okbg:rgba(63,168,147,.11);--bad:#E08A85;--badbg:rgba(201,96,91,.11);
--vio:#A79CE4;--viobg:rgba(139,127,212,.11);--mono:'IBM Plex Mono',ui-monospace,monospace;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ink);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:24px 18px 90px}
h1,h2,h3{font-family:Archivo,sans-serif;margin:0;letter-spacing:-.015em}
h1{font-size:30px;font-weight:700;line-height:1.1}h2{font-size:17px;font-weight:600;margin-bottom:3px}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mast{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--sig);margin-bottom:8px}
.sub{color:var(--dim);font-size:13px;margin-top:6px;max-width:78ch}
.tabs{display:flex;margin:0 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);font-family:Archivo,sans-serif;
font-weight:600;font-size:12.5px;padding:10px 15px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--tx)}.tab.on{color:var(--sig);border-bottom-color:var(--sig)}
.tab .n{font-family:var(--mono);color:var(--dim);margin-right:6px;font-size:10.5px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:19px 21px;margin-bottom:15px}
.card.tight{padding:14px 16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:13px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--faint);line-height:1.6}
label{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;font-weight:500}
input,select{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--tx);padding:7px 9px;border-radius:6px;font-family:var(--mono);font-size:12.5px}
input[type=text]{font-family:'IBM Plex Sans',sans-serif}
input:focus,select:focus{outline:0;border-color:var(--sig)}
input[type=range]{padding:0;accent-color:var(--sig);border:0;background:none}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:820px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}}
.btn{background:var(--sig);color:#1B1305;border:0;padding:9px 17px;border-radius:7px;font-family:Archivo,sans-serif;font-weight:600;font-size:12.5px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn2{background:transparent;color:var(--dim);border:1px solid var(--line2);padding:7px 13px;border-radius:7px;font-size:12px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.btn2:hover{border-color:var(--sig);color:var(--sig)}.btn2.sm{padding:4px 9px;font-size:11px;min-height:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.stats{grid-template-columns:1fr}}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:14px 15px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sig)}
.stat.u::before{background:var(--ok)}.stat.c::before{background:var(--vio)}.stat.r::before{background:var(--bad)}
.stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.15;margin:2px 0}
.stat .f{font-family:var(--mono);font-size:11px;color:var(--faint)}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono)}
.p-me{background:var(--sigbg);color:var(--sig)}.p-uwe{background:var(--okbg);color:var(--ok)}
.p-ccc{background:var(--viobg);color:var(--vio)}.p-w{background:var(--badbg);color:var(--bad)}
.p-m{background:var(--s3);color:var(--dim)}.p-nb{background:var(--s3);color:var(--faint)}
.flag{border-left:3px solid;padding:10px 13px;margin:10px 0;font-size:12.5px;line-height:1.6}
.f-bad{border-color:var(--bad);background:var(--badbg)}.f-warn{border-color:var(--sig);background:var(--sigbg)}
.f-ok{border-color:var(--ok);background:var(--okbg)}.f-q{border-color:var(--vio);background:var(--viobg)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{max-height:440px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.scroll th{position:sticky;top:0;background:var(--s1);z-index:2}
.chk{width:16px;height:16px;accent-color:var(--sig);cursor:pointer;min-height:24px}
.tiny{font-size:11px;color:var(--faint);font-family:var(--mono)}.mut{color:var(--dim)}
.srch{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.srch input{flex:1;min-width:170px}.srch select{width:auto;min-width:112px}
.bar{height:5px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--sig);border-radius:3px}
.bar.ok>i{background:var(--ok)}.bar.bad>i{background:var(--bad)}
.ladder{position:relative;height:32px;background:var(--s2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.ld{position:absolute;bottom:0;background:var(--vio);opacity:.5}
.lb{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--sig);box-shadow:0 0 6px var(--sig)}
.lb::after{content:attr(data-l);position:absolute;top:1px;left:5px;font-family:var(--mono);font-size:9.5px;color:var(--sig);white-space:nowrap;font-weight:600}
.lc{position:absolute;top:0;bottom:0;width:1px;background:var(--bad);opacity:.85}
.ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:2px}
.rec{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:11px}
.rec.top{border-color:var(--sig)}
.kv{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px dotted var(--line)}
.kv:last-child{border:0}.kv span:last-child{font-family:var(--mono)}
details.more{border:1px solid var(--line);border-radius:9px;padding:2px 16px;margin-top:10px;background:var(--s2)}
details.more>summary{cursor:pointer;padding:11px 0;font-weight:600;font-size:13px;color:var(--dim);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'+ ';color:var(--sig);font-family:var(--mono)}
details.more[open]>summary::before{content:'\2212 '}
details.more[open]>summary{border-bottom:1px solid var(--line)}
details.more>*:not(summary){margin-top:12px}
details.more>*:last-child{margin-bottom:14px}
/* timetable */
.ttwrap{overflow-x:auto}
.tt{position:relative;display:grid;grid-template-columns:54px repeat(6,minmax(112px,1fr));gap:2px;min-width:760px}
.tt .hh{background:var(--s2);padding:5px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--dim);border-radius:4px;position:sticky;top:0;z-index:3}
.col{position:relative;background:var(--s1);border-radius:4px}
.hrline{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.55}
.hrlab{font-family:var(--mono);font-size:9.5px;color:var(--faint);text-align:right;padding-right:5px;position:absolute;right:0;transform:translateY(-6px)}
.ev{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 4px;overflow:hidden;font-size:9.5px;line-height:1.25;font-family:var(--mono);z-index:2;cursor:default}
.ev b{font-size:10px}
.ev.fix{background:#2F3B45;color:#D6E0E7;border-left:3px solid var(--dim)}
.ev.me{background:#4A3717;color:#F5D09B;border-left:3px solid var(--sig)}
.ev.uwe{background:#173A34;color:#9CDECF;border-left:3px solid var(--ok)}
.ev.ccc{background:#2E2A4C;color:#C9C2F2;border-left:3px solid var(--vio)}
.ev.nb{background:#333A42;color:#CBD4DB;border-left:3px solid var(--faint)}
.ev.bad{outline:2px solid var(--bad);outline-offset:-2px}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.qbox{background:var(--viobg);border:1px solid rgba(139,127,212,.35);border-radius:9px;padding:14px 16px;margin-bottom:11px}
.qbox b{color:var(--vio)}

button,select,input[type=checkbox],input[type=number],input[type=text]{min-height:24px}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.scroll:focus-visible,.ttwrap:focus-visible{outline:2px solid var(--sig);outline-offset:-2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}

.progress{height:6px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;width:0;background:var(--sig);border-radius:3px;transition:width .2s linear}
.pathway-steps{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}.pathway-steps span{font:600 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--faint);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:7px 10px}.pathway-steps span.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 42%,var(--line))}
.pathway-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--vio) 12%,var(--s2)),var(--s2));border:1px solid var(--vio);border-radius:12px;padding:17px;margin-top:13px}.pathway-hero h3{margin:3px 0;font-size:21px}.eyebrow{font:600 10px var(--mono);letter-spacing:.1em;color:var(--vio)}.pathway-metrics{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:8px;margin-top:13px}.pathway-metrics div{background:color-mix(in srgb,var(--s1) 80%,transparent);padding:10px;border-radius:8px}.pathway-metrics b{display:block;font:600 22px var(--mono)}.pathway-metrics span{font-size:10px;color:var(--dim);text-transform:uppercase}.pathway-progress{grid-column:1/-1;height:8px}
.pathway-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.pathway-choice{display:flex;gap:10px;width:100%;text-align:left;background:var(--s2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;font:inherit;transition:border-color .15s,transform .15s,background .15s}.pathway-choice:hover{border-color:var(--sig);transform:translateY(-1px)}.pathway-choice.selected{border-color:var(--vio);background:color-mix(in srgb,var(--vio) 10%,var(--s2));box-shadow:0 0 0 1px color-mix(in srgb,var(--vio) 35%,transparent)}.pathway-radio{font:600 18px var(--mono);color:var(--vio)}.pathway-choice small,.pathway-choice em{display:block;margin-top:5px;color:var(--dim);font-size:11px;font-style:normal}.pathway-choice em.selected,.pathway-choice em.ok{color:var(--ok)}.pathway-choice em.warn{color:var(--sig)}
.pathway-courses{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px;padding:10px;background:var(--s1);border-radius:8px}.pathway-courses>b{width:100%;font-size:11px}.pathway-courses .active{border-color:var(--ok);color:var(--ok)}
@media(max-width:620px){.pathway-metrics{grid-template-columns:1fr}.pathway-choice{padding:11px}.pathway-steps span{flex:1 1 45%}}
.progress.indet>i{width:35%;animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{margin-left:-35%}100%{margin-left:100%}}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--sig);border-right-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.progress.indet>i,.spin{animation:none}}
</style></head><body><div class="wrap">
