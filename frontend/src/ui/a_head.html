<style>
:root{--ink:#0D1115;--s1:#151B21;--s2:#1D242B;--s3:#263039;--line:#29333C;--line2:#3B4855;
--tx:#E7EAED;--dim:#94A4B1;--faint:#93A1AD;--sig:#E9A13B;--sigbg:rgba(233,161,59,.10);
--ok:#5CBCA6;--okbg:rgba(63,168,147,.11);--bad:#E08A85;--badbg:rgba(201,96,91,.11);
--vio:#A79CE4;--viobg:rgba(139,127,212,.11);--mono:'IBM Plex Mono',ui-monospace,monospace;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ink);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1880px;margin:0 auto;padding:22px 32px 90px;width:100%}
@media(max-width:900px){.wrap{padding:16px 14px 60px}}
h1,h2,h3{font-family:Archivo,sans-serif;margin:0;letter-spacing:-.015em}
h1{font-size:30px;font-weight:700;line-height:1.1}h2{font-size:17px;font-weight:600;margin-bottom:3px}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mast{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--sig);margin-bottom:8px}
.sub{color:var(--dim);font-size:13px;margin-top:6px;max-width:90ch}
.tabs{display:flex;margin:0 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);font-family:Archivo,sans-serif;
font-weight:600;font-size:12.5px;padding:10px 15px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--tx)}.tab.on{color:var(--sig);border-bottom-color:var(--sig)}
.tab .n{font-family:var(--mono);color:var(--dim);margin-right:6px;font-size:10.5px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:19px 21px;margin-bottom:15px}
.card.tight{padding:14px 16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:13px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--faint);line-height:1.6;max-width:105ch}
label{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;font-weight:500}
input,select{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--tx);padding:7px 9px;border-radius:6px;font-family:var(--mono);font-size:12.5px}
input[type=text]{font-family:'IBM Plex Sans',sans-serif}
input:focus,select:focus{outline:0;border-color:var(--sig)}
input[type=range]{padding:0;accent-color:var(--sig);border:0;background:none}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(min-width:1500px){.g3{grid-template-columns:repeat(4,1fr)}.g4{grid-template-columns:repeat(5,1fr)}}
@media(max-width:820px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}}
.btn{background:var(--sig);color:#1B1305;border:0;padding:9px 17px;border-radius:7px;font-family:Archivo,sans-serif;font-weight:600;font-size:12.5px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn2{background:transparent;color:var(--dim);border:1px solid var(--line2);padding:7px 13px;border-radius:7px;font-size:12px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.btn2:hover{border-color:var(--sig);color:var(--sig)}.btn2.sm{padding:4px 9px;font-size:11px;min-height:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.stats{grid-template-columns:1fr}}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:14px 15px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sig)}
.stat.u::before{background:var(--ok)}.stat.c::before{background:var(--vio)}.stat.r::before{background:var(--bad)}
.stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.15;margin:2px 0}
.stat .f{font-family:var(--mono);font-size:11px;color:var(--faint)}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono)}
.p-me{background:var(--sigbg);color:var(--sig)}.p-uwe{background:var(--okbg);color:var(--ok)}
.p-ccc{background:var(--viobg);color:var(--vio)}.p-w{background:var(--badbg);color:var(--bad)}
.p-m{background:var(--s3);color:var(--dim)}.p-nb{background:var(--s3);color:var(--faint)}
.flag{border-left:3px solid;padding:10px 13px;margin:10px 0;font-size:12.5px;line-height:1.6}
.f-bad{border-color:var(--bad);background:var(--badbg)}.f-warn{border-color:var(--sig);background:var(--sigbg)}
.f-ok{border-color:var(--ok);background:var(--okbg)}.f-q{border-color:var(--vio);background:var(--viobg)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{max-height:440px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.scroll th{position:sticky;top:0;background:var(--s1);z-index:2}
.chk{width:16px;height:16px;accent-color:var(--sig);cursor:pointer;min-height:24px}
.tiny{font-size:11px;color:var(--faint);font-family:var(--mono)}.mut{color:var(--dim)}
.comparison-row{background:var(--s2)}
.srch{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.srch input{flex:1;min-width:170px}.srch select{width:auto;min-width:112px}
.bar{height:5px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--sig);border-radius:3px}
.bar.ok>i{background:var(--ok)}.bar.bad>i{background:var(--bad)}
.ladder{position:relative;height:32px;background:var(--s2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.ld{position:absolute;bottom:0;background:var(--vio);opacity:.5}
.lb{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--sig);box-shadow:0 0 6px var(--sig)}
.lb::after{content:attr(data-l);position:absolute;top:1px;left:5px;font-family:var(--mono);font-size:9.5px;color:var(--sig);white-space:nowrap;font-weight:600}
.lc{position:absolute;top:0;bottom:0;width:1px;background:var(--bad);opacity:.85}
.ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:2px}
.rec{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:11px}
.rec.top{border-color:var(--sig)}
.kv{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px dotted var(--line)}
.kv:last-child{border:0}.kv span:last-child{font-family:var(--mono)}
details.more{border:1px solid var(--line);border-radius:9px;padding:2px 16px;margin-top:10px;background:var(--s2)}
details.more>summary{cursor:pointer;padding:11px 0;font-weight:600;font-size:13px;color:var(--dim);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'+ ';color:var(--sig);font-family:var(--mono)}
details.more[open]>summary::before{content:'\2212 '}
details.more[open]>summary{border-bottom:1px solid var(--line)}
details.more>*:not(summary){margin-top:12px}
details.more>*:last-child{margin-bottom:14px}
/* timetable */
.ttwrap{overflow-x:auto}
.tt{position:relative;display:grid;grid-template-columns:54px repeat(6,minmax(112px,1fr));gap:2px;min-width:760px}
.tt .hh{background:var(--s2);padding:5px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--dim);border-radius:4px;position:sticky;top:0;z-index:3}
.col{position:relative;background:var(--s1);border-radius:4px}
.hrline{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.55}
.hrlab{font-family:var(--mono);font-size:9.5px;color:var(--faint);text-align:right;padding-right:5px;position:absolute;right:0;transform:translateY(-6px)}
.ev{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 4px;overflow:hidden;font-size:9.5px;line-height:1.25;font-family:var(--mono);z-index:2;cursor:default}
.ev b{font-size:10px}
.ev.fix{background:#2F3B45;color:#D6E0E7;border-left:3px solid var(--dim)}
.ev.me{background:#4A3717;color:#F5D09B;border-left:3px solid var(--sig)}
.ev.uwe{background:#173A34;color:#9CDECF;border-left:3px solid var(--ok)}
.ev.ccc{background:#2E2A4C;color:#C9C2F2;border-left:3px solid var(--vio)}
.ev.nb{background:#333A42;color:#CBD4DB;border-left:3px solid var(--faint)}
.ev.bad{outline:2px solid var(--bad);outline-offset:-2px}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.qbox{background:var(--viobg);border:1px solid rgba(139,127,212,.35);border-radius:9px;padding:14px 16px;margin-bottom:11px}
.qbox b{color:var(--vio)}

button,select,input[type=checkbox],input[type=number],input[type=text]{min-height:24px}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.scroll:focus-visible,.ttwrap:focus-visible{outline:2px solid var(--sig);outline-offset:-2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}

.progress{height:6px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;width:0;background:var(--sig);border-radius:3px;transition:width .2s linear}
.pathway-steps{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}.pathway-steps span{font:600 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--faint);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:7px 10px}.pathway-steps span.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 42%,var(--line))}
.pathway-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--vio) 12%,var(--s2)),var(--s2));border:1px solid var(--vio);border-radius:12px;padding:17px;margin-top:13px}.pathway-hero h3{margin:3px 0;font-size:21px}.eyebrow{font:600 10px var(--mono);letter-spacing:.1em;color:var(--vio)}.pathway-metrics{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:8px;margin-top:13px}.pathway-metrics div{background:color-mix(in srgb,var(--s1) 80%,transparent);padding:10px;border-radius:8px}.pathway-metrics b{display:block;font:600 22px var(--mono)}.pathway-metrics span{font-size:10px;color:var(--dim);text-transform:uppercase}.pathway-progress{grid-column:1/-1;height:8px}
.pathway-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.pathway-choice{display:flex;gap:10px;width:100%;text-align:left;background:var(--s2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;font:inherit;transition:border-color .15s,transform .15s,background .15s}.pathway-choice:hover{border-color:var(--sig);transform:translateY(-1px)}.pathway-choice.selected{border-color:var(--vio);background:color-mix(in srgb,var(--vio) 10%,var(--s2));box-shadow:0 0 0 1px color-mix(in srgb,var(--vio) 35%,transparent)}.pathway-radio{font:600 18px var(--mono);color:var(--vio)}.pathway-choice small,.pathway-choice em{display:block;margin-top:5px;color:var(--dim);font-size:11px;font-style:normal}.pathway-choice em.selected,.pathway-choice em.ok{color:var(--ok)}.pathway-choice em.warn{color:var(--sig)}.pathway-choice em.check{color:var(--warn)}
.pathway-courses{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px;padding:10px;background:var(--s1);border-radius:8px}.pathway-courses>b{width:100%;font-size:11px}.pathway-courses .active{border-color:var(--ok);color:var(--ok)}
@media(max-width:620px){.pathway-metrics{grid-template-columns:1fr}.pathway-choice{padding:11px}.pathway-steps span{flex:1 1 45%}}
.progress.indet>i{width:35%;animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{margin-left:-35%}100%{margin-left:100%}}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--sig);border-right-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.progress.indet>i,.spin{animation:none}}

/* ============================================================
   SNU ROYAL DESIGN SYSTEM — presentation only
   One semantic token set powers both themes. The official Royal Blue
   (#1A73E8) and White (#FFFFFF) remain the visual signature throughout.
   ============================================================ */
:root,[data-theme="light"]{
  color-scheme:light;
  --ink:#F5F8FE;--s1:rgba(255,255,255,.92);--s2:#F0F5FD;--s3:#E5EDF9;
  --line:rgba(28,61,104,.12);--line2:rgba(26,115,232,.28);
  --tx:#10213A;--dim:#586A82;--faint:#6D7F96;
  --sig:#1A73E8;--sig-hi:#4B93F0;--sig-soft:#DCEBFF;--sigbg:rgba(26,115,232,.09);
  --ok:#087F68;--okbg:rgba(8,127,104,.09);--bad:#C84545;--badbg:rgba(200,69,69,.08);
  --vio:#3479C9;--viobg:rgba(52,121,201,.09);--warn:#B46A09;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --display:'Manrope','Inter',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;
  --shadow-sm:0 1px 2px rgba(20,44,79,.04),0 7px 22px rgba(31,78,140,.05);
  --shadow-md:0 1px 2px rgba(20,44,79,.05),0 14px 38px rgba(31,78,140,.10);
  --shadow-lg:0 1px 2px rgba(20,44,79,.06),0 24px 70px rgba(31,78,140,.16);
  --glass:rgba(255,255,255,.74);--grid-dot:rgba(26,115,232,.10);
}
[data-theme="dark"]{
  color-scheme:dark;
  --ink:#05080D;--s1:rgba(12,18,28,.86);--s2:#111A27;--s3:#192536;
  --line:rgba(207,226,255,.09);--line2:rgba(90,163,255,.30);
  --tx:#EEF5FF;--dim:#9AAAC0;--faint:#8495AC;
  --sig:#1A73E8;--sig-hi:#6AABFF;--sig-soft:#102A4D;--sigbg:rgba(26,115,232,.14);
  --ok:#5FD1B7;--okbg:rgba(58,190,160,.11);--bad:#FF8E8E;--badbg:rgba(224,98,98,.11);
  --vio:#7AB5FA;--viobg:rgba(75,147,232,.12);--warn:#F4B75E;
  --shadow-sm:0 0 0 1px rgba(255,255,255,.025),0 8px 24px rgba(0,0,0,.24);
  --shadow-md:0 0 0 1px rgba(255,255,255,.035),0 18px 48px rgba(0,0,0,.36),0 0 48px rgba(26,115,232,.025);
  --shadow-lg:0 0 0 1px rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.50),0 0 90px rgba(26,115,232,.08);
  --glass:rgba(7,12,20,.73);--grid-dot:rgba(112,174,255,.09);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme]){
    color-scheme:dark;
    --ink:#05080D;--s1:rgba(12,18,28,.86);--s2:#111A27;--s3:#192536;
    --line:rgba(207,226,255,.09);--line2:rgba(90,163,255,.30);
    --tx:#EEF5FF;--dim:#9AAAC0;--faint:#8495AC;--sig:#1A73E8;--sig-hi:#6AABFF;
    --sig-soft:#102A4D;--sigbg:rgba(26,115,232,.14);--ok:#5FD1B7;--okbg:rgba(58,190,160,.11);
    --bad:#FF8E8E;--badbg:rgba(224,98,98,.11);--vio:#7AB5FA;--viobg:rgba(75,147,232,.12);
    --warn:#F4B75E;--shadow-sm:0 0 0 1px rgba(255,255,255,.025),0 8px 24px rgba(0,0,0,.24);
    --shadow-md:0 0 0 1px rgba(255,255,255,.035),0 18px 48px rgba(0,0,0,.36),0 0 48px rgba(26,115,232,.025);
    --shadow-lg:0 0 0 1px rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.50),0 0 90px rgba(26,115,232,.08);
    --glass:rgba(7,12,20,.73);--grid-dot:rgba(112,174,255,.09);
  }
}

html{scroll-behavior:smooth;background:var(--ink)}
body{position:relative;min-height:100vh;background:
  radial-gradient(1000px 700px at 82% -12%,rgba(26,115,232,.14),transparent 66%),
  radial-gradient(800px 600px at -10% 32%,rgba(26,115,232,.07),transparent 65%),
  var(--ink);color:var(--tx);font-family:var(--body);font-size:14px;line-height:1.6;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:
  linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 70%);opacity:.34}
body::after{content:'';position:fixed;width:55vw;height:55vw;min-width:520px;min-height:520px;right:-24vw;top:20vh;
  z-index:-1;pointer-events:none;border-radius:50%;background:rgba(26,115,232,.075);filter:blur(120px);animation:ambientFloat 11s ease-in-out infinite}
@keyframes ambientFloat{50%{transform:translate3d(-4vw,-3vh,0) scale(1.06)}}
.wrap{max-width:1920px;padding:24px clamp(16px,2.4vw,44px) 100px;isolation:isolate}
h1,h2,h3{font-family:var(--display);color:var(--tx)}
h1{font-size:clamp(31px,3.3vw,58px);font-weight:800;letter-spacing:-.05em;line-height:1.02}
h2{font-size:clamp(17px,1.3vw,22px);font-weight:750;letter-spacing:-.025em;line-height:1.2}
h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em}
a{color:var(--sig-hi);text-underline-offset:3px}a:hover{text-decoration-thickness:2px}
.mono,.tiny{font-family:var(--mono)}

/* Masthead and service state */
header{position:relative}
.mast{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;padding:clamp(22px,3vw,42px);
  margin:0 0 14px;background:linear-gradient(145deg,var(--s1),color-mix(in srgb,var(--s1) 82%,var(--sig) 18%));box-shadow:var(--shadow-md)}
.mast::before{content:'';position:absolute;inset:auto -7% -75% auto;width:44%;aspect-ratio:1;border:1px solid color-mix(in srgb,var(--sig) 35%,transparent);border-radius:50%;box-shadow:0 0 0 35px rgba(26,115,232,.035),0 0 0 70px rgba(26,115,232,.02);animation:slowSpin 60s linear infinite}
.mast::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 20%,rgba(26,115,232,.16),transparent 30%)}
@keyframes slowSpin{to{transform:rotate(360deg)}}
.mast-grid{position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}
.brand-mark{display:grid;place-items:center;width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#1A73E8,#60A5FA);color:#fff;
  font:800 25px var(--display);box-shadow:0 14px 35px rgba(26,115,232,.28),inset 0 1px 0 rgba(255,255,255,.35);transform:rotate(-4deg)}
.brand-mark span{transform:rotate(4deg)}
.eyebrow{display:inline-flex;align-items:center;gap:9px;margin-bottom:10px;color:var(--sig-hi);font:600 10px var(--mono);letter-spacing:.16em}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--sig);box-shadow:0 0 0 6px var(--sigbg);animation:statusPulse 2.4s ease-in-out infinite}
@keyframes statusPulse{50%{box-shadow:0 0 0 10px transparent;transform:scale(.9)}}
.sub{font-size:clamp(13px,1vw,15px);line-height:1.7;max-width:95ch;margin-top:12px}
.mast-actions{position:relative;z-index:2;align-self:start;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.theme-control{display:inline-flex;gap:3px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--shadow-sm)}
.theme-choice{display:grid;place-items:center;width:38px;height:36px;min-height:36px;border:0;border-radius:10px;background:transparent;color:var(--dim);cursor:pointer;font-size:16px;transition:.2s cubic-bezier(.16,1,.3,1)}
.theme-choice:hover{background:var(--s2);color:var(--tx);transform:translateY(-1px)}
.theme-choice.on{background:var(--sig);color:#fff;box-shadow:0 7px 18px rgba(26,115,232,.28)}
.theme-caption{font:500 9px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.preference-panel{display:grid;gap:5px;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--shadow-sm)}
.preference-row{display:flex;align-items:center;justify-content:flex-end;gap:8px}.preference-row>span{font:600 8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.preference-panel .theme-control{padding:0;border:0;background:transparent;box-shadow:none;backdrop-filter:none}
.motion-control{display:flex;gap:3px}.motion-choice{min-height:34px;padding:5px 8px;border:0;border-radius:8px;background:transparent;color:var(--dim);font:600 8.5px var(--mono);cursor:pointer;transition:transform .18s,background .18s,color .18s}
.motion-choice:hover{background:var(--s2);color:var(--tx);transform:translateY(-1px)}.motion-choice.on{background:var(--sig);color:#fff;box-shadow:0 5px 13px rgba(26,115,232,.24)}
.status-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px;margin-bottom:14px}
.status-grid>.flag{margin:0;min-height:58px;border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:14px;background:var(--s1);box-shadow:var(--shadow-sm);display:flex;align-items:center}
.status-grid>.f-warn{border-left-color:var(--warn)}

/* Navigation and contextual rail */
main{position:relative}
.scroll-progress{position:fixed;z-index:100;top:0;left:0;right:0;height:3px;background:transparent;pointer-events:none}
.scroll-progress i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,#1A73E8,#75B5FF);box-shadow:0 0 14px rgba(26,115,232,.55);will-change:transform}
.tabs{position:sticky;top:10px;z-index:30;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:0 0 14px;padding:6px;
  border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(20px) saturate(145%);box-shadow:var(--shadow-md);overflow:visible}
.tab{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:8px 10px;border:0;border-radius:11px;color:var(--dim);font:650 12px var(--display);transition:.22s cubic-bezier(.16,1,.3,1)}
.tab::after{content:'';position:absolute;inset:auto 18% 3px;height:2px;border-radius:2px;background:var(--sig);transform:scaleX(0);transition:transform .22s cubic-bezier(.16,1,.3,1)}
.tab:hover{color:var(--tx);background:var(--s2);transform:translateY(-1px)}
.tab.on{color:var(--tx);background:linear-gradient(135deg,var(--sigbg),color-mix(in srgb,var(--sigbg) 20%,var(--s1)));box-shadow:inset 0 0 0 1px var(--line2)}
.tab.on::after{transform:scaleX(1)}
.tab .n{display:grid;place-items:center;width:25px;height:25px;margin:0;border-radius:8px;background:var(--s3);color:var(--faint);font-size:9px;transition:.2s}
.tab.on .n{background:var(--sig);color:#fff;box-shadow:0 5px 12px rgba(26,115,232,.25)}
.journey-bar{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;margin:0 0 14px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(120deg,var(--s1),color-mix(in srgb,var(--s1) 90%,var(--sig) 10%));box-shadow:var(--shadow-sm);overflow:hidden}
.journey-track{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.journey-track i{height:4px;border-radius:99px;background:var(--s3);transition:background .25s,transform .25s}.journey-track i.done{background:var(--sig)}.journey-track i.current{background:var(--sig-hi);transform:scaleY(1.55);box-shadow:0 0 12px var(--sigbg)}
.journey-copy{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;min-width:0}.journey-count{font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--sig-hi)}.journey-copy strong{font:750 14px var(--display)}.journey-copy>span:last-child{grid-column:1/-1;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.journey-actions{display:flex;gap:7px}.journey-actions .btn2:disabled{opacity:.35;cursor:not-allowed;transform:none}
.workspace-shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start;scroll-margin-top:78px}
.workspace-rail{position:sticky;top:84px;display:grid;gap:12px}
.rail-card{border:1px solid var(--line);border-radius:18px;padding:15px;background:var(--s1);box-shadow:var(--shadow-sm);overflow:hidden}
.rail-label{display:flex;align-items:center;gap:8px;margin-bottom:10px;font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.rail-label::before{content:'';width:16px;height:2px;border-radius:2px;background:var(--sig)}
.section-nav{display:grid;gap:4px}
.section-link{display:flex;align-items:flex-start;gap:8px;width:100%;min-height:38px;padding:8px 9px;border:0;border-radius:9px;background:transparent;color:var(--dim);text-align:left;font:550 11.5px/1.35 var(--body);cursor:pointer;transition:.2s}
.section-link::before{content:'';flex:0 0 auto;width:5px;height:5px;margin-top:5px;border-radius:50%;background:var(--line2)}
.section-link:hover,.section-link.current{color:var(--tx);background:var(--sigbg)}
.section-link.current::before{background:var(--sig);box-shadow:0 0 0 4px var(--sigbg)}
.rail-tip{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.55;color:var(--faint)}
.workspace-content{min-width:0}
.pane{display:none;animation:paneIn .42s cubic-bezier(.16,1,.3,1)}
.pane.on{display:block}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Surfaces and component interaction */
.card,.rec,.qbox,details.more{position:relative;isolation:isolate;background:var(--s1);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.card{border-radius:18px;padding:clamp(16px,1.7vw,25px);margin-bottom:14px;overflow:hidden;transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .25s}
.card::before{content:'';position:absolute;z-index:-1;inset:0;pointer-events:none;opacity:0;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(26,115,232,.14),transparent 68%);transition:opacity .28s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--sig) 28%,var(--line));box-shadow:var(--shadow-md)}
.card:hover::before{opacity:1}.card.tight{padding:clamp(15px,1.35vw,20px)}
.hd{margin-bottom:16px}.hd h2::after,.card>h2:first-child::after{content:'';display:block;width:32px;height:3px;margin-top:8px;border-radius:3px;background:linear-gradient(90deg,var(--sig),transparent)}
.note{font-size:12.5px;line-height:1.7}.mut,.note,.tiny{color:var(--dim)}
.grid{gap:13px}.g2,.g3,.g4,.g5{align-items:start}
label{color:var(--faint);font:600 10px var(--mono);letter-spacing:.07em;margin-bottom:6px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--s2);color:var(--tx);font:500 12px var(--mono);transition:border-color .2s,box-shadow .2s,background .2s}
input[type=text],textarea{font-family:var(--body)}
input:hover,select:hover,textarea:hover{border-color:var(--line2);background:color-mix(in srgb,var(--s2) 88%,var(--sig) 12%)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--sig);box-shadow:0 0 0 4px var(--sigbg),0 8px 24px rgba(26,115,232,.08)}
input[readonly]{opacity:.76;cursor:not-allowed}input[type=checkbox]{min-height:18px;accent-color:var(--sig)}
.btn,.btn2{position:relative;isolation:isolate;min-height:44px;border-radius:11px;padding:10px 16px;font:700 12px var(--display);transition:.2s cubic-bezier(.16,1,.3,1)}
.btn{overflow:hidden;background:linear-gradient(135deg,#1A73E8,#4B93F0);color:#fff;box-shadow:0 8px 22px rgba(26,115,232,.24),inset 0 1px 0 rgba(255,255,255,.25)}
.btn::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 15%,rgba(255,255,255,.28) 48%,transparent 80%);transform:translateX(-130%);transition:transform .5s}
.btn:hover{filter:none;transform:translateY(-2px);box-shadow:0 12px 30px rgba(26,115,232,.34),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:hover::after{transform:translateX(130%)}.btn:active,.btn2:active{transform:scale(.98)}
.btn2{background:var(--s2);color:var(--dim);border:1px solid var(--line);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--tx) 7%,transparent)}
.btn2:hover{color:var(--sig-hi);border-color:var(--line2);background:var(--sigbg);transform:translateY(-1px)}
.btn2.sm{min-height:34px;padding:6px 10px;border-radius:9px}
.stats{gap:13px}.stat{min-height:112px;padding:16px 17px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,var(--s2),color-mix(in srgb,var(--s2) 88%,var(--sig) 12%));box-shadow:var(--shadow-sm);transition:.22s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}.stat::before{width:4px;background:linear-gradient(var(--sig),var(--sig-hi))}
.stat .k{font:600 9.5px var(--mono);letter-spacing:.09em}.stat .v{font:700 clamp(27px,2.5vw,39px) var(--display);letter-spacing:-.04em;margin:7px 0}.stat .f{line-height:1.55}
.pill{padding:3px 8px;border:1px solid color-mix(in srgb,currentColor 18%,transparent);font-size:9px}
.flag{border-width:1px 1px 1px 3px;border-style:solid;border-radius:12px;padding:12px 14px;background:var(--s2);box-shadow:var(--shadow-sm)}
.f-ok{border-color:color-mix(in srgb,var(--ok) 35%,var(--line));border-left-color:var(--ok)}
.f-warn{border-color:color-mix(in srgb,var(--warn) 30%,var(--line));border-left-color:var(--warn);background:color-mix(in srgb,var(--s1) 91%,var(--warn) 9%)}
.f-bad{border-color:color-mix(in srgb,var(--bad) 30%,var(--line));border-left-color:var(--bad)}
.f-q{border-color:color-mix(in srgb,var(--sig) 28%,var(--line));border-left-color:var(--sig)}
.scroll{max-height:520px;border-radius:13px;border-color:var(--line);background:var(--s1);scrollbar-color:var(--line2) transparent}
.scroll th{background:color-mix(in srgb,var(--s1) 92%,var(--sig) 8%);backdrop-filter:blur(12px)}
th{padding:10px 11px;font:600 9px var(--mono);letter-spacing:.08em}td{padding:10px 11px}tbody tr{transition:background .16s}tbody tr:hover{background:var(--sigbg)}
.srch{gap:9px;margin-bottom:13px}.srch>*{flex:0 1 auto}.srch input{flex:1 1 220px}
.rec,.qbox{border-radius:14px;padding:16px;margin-bottom:12px}.rec:hover,.qbox:hover{border-color:var(--line2)}
details.more{border-radius:16px;padding:3px 18px;background:var(--s1);overflow:hidden}
details.more>summary{min-height:48px;display:flex;align-items:center;color:var(--tx);font:700 13px var(--display)}
details.more>summary::before{display:grid;place-items:center;width:24px;height:24px;margin-right:9px;border-radius:8px;background:var(--sigbg);color:var(--sig-hi)}
details.more[open]>summary{border-bottom-color:var(--line)}
.progress{height:8px;background:var(--s3)}.progress>i{background:linear-gradient(90deg,var(--sig),var(--sig-hi))}

/* Timetable and pathways */
.ttwrap{border:1px solid var(--line);border-radius:15px;padding:8px;background:var(--s2)}
.tt .hh{padding:8px 5px;background:var(--s1);border:1px solid var(--line)}.col{background:color-mix(in srgb,var(--s1) 86%,transparent)}
.ev{border-radius:7px;padding:4px 5px;box-shadow:0 5px 12px rgba(0,0,0,.12);transition:filter .15s,transform .15s}.ev:hover{filter:brightness(1.1);transform:scale(1.01);z-index:4}
.ev.fix{background:#29405C;color:#EAF3FF;border-left-color:#90A9C5}.ev.me{background:#173B69;color:#DDEEFF;border-left-color:#5EA3F7}
.ev.uwe{background:#123F3A;color:#BDF2E7;border-left-color:#55CFB4}.ev.ccc{background:#29385A;color:#DCE9FF;border-left-color:#86B9F4}.ev.nb{background:#293544;color:#D8E2EF}
.legend{padding:9px 12px;border-radius:11px;background:var(--s2)}
.pathway-hero{border-color:var(--line2);background:linear-gradient(135deg,var(--sigbg),var(--s2));box-shadow:var(--shadow-sm)}
.pathway-choice{background:var(--s2);color:var(--tx);border-color:var(--line);border-radius:14px;min-height:84px}.pathway-choice:hover{border-color:var(--sig);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.pathway-choice.selected{border-color:var(--sig);background:var(--sigbg);box-shadow:0 0 0 1px var(--sigbg),var(--shadow-sm)}.pathway-radio{color:var(--sig-hi)}
.pathway-steps span{background:var(--s2);border-color:var(--line);padding:8px 11px}.pathway-courses{background:var(--s2)}

/* Readable workspace composition. Major tools use the full content width so
   long programme names, controls and tables never get squeezed into half-cards. */
#p-prof.on,#p-courses.on,#p-timetable.on,#p-bid.on,#p-two.on,#p-rules.on{display:flex;flex-direction:column;gap:16px;align-items:stretch}
#p-prof>.card,#p-courses>.card,#p-courses>#categoryCoverageNote,#p-courses>#categoryMigrationNote,
#p-timetable>.card,#p-timetable>details,#p-timetable>#wishOut,
#p-bid>.card,#p-bid>#bidOut,#p-two>.card,#p-two>details,#p-rules>.card,#p-rules>details{width:100%;min-width:0;margin:0}
#learnBox{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}#learnBox>.card{margin:0}#learnBox>.card:nth-child(1){grid-column:span 7}#learnBox>.card:nth-child(2){grid-column:span 5}#learnBox>.card:nth-child(2) .stats{grid-template-columns:1fr}#learnBox>details{grid-column:span 12;margin:0}
#p-bid>.card:first-child{background:linear-gradient(135deg,color-mix(in srgb,var(--s1) 84%,var(--sig) 16%),var(--s1))}
#bidOut>.card,#wishOut>.card{animation:resultIn .45s cubic-bezier(.16,1,.3,1)}
@keyframes resultIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}

/* Dense information without nested two-axis scrolling. */
.table-shell,.responsive-table{width:100%;min-width:0;overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--s1)}
.table-shell table,.responsive-table table{margin:0}
.catalog-list{max-height:none;overflow:visible}
.catalog-list table{table-layout:fixed}
.catalog-list th:nth-child(1){width:42px}.catalog-list th:nth-child(2){width:24%}.catalog-list th:nth-child(3){width:68px}
.catalog-list th:nth-child(4){width:90px}.catalog-list th:nth-child(5),.catalog-list th:nth-child(6),.catalog-list th:nth-child(8){width:58px}
.catalog-list th:nth-child(7){width:76px}.catalog-list th:nth-child(10){width:64px}
.catalog-list td,.table-shell td,.responsive-table td{overflow-wrap:anywhere}
.list-pagination{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 4px 1px}
.table-shell select,.responsive-table select{max-width:100%;min-width:0!important}
.course-title{display:block;margin-top:3px;color:var(--dim);font-size:12px;line-height:1.45}.course-meta{display:block;margin-top:5px;color:var(--faint);font:500 10.5px/1.55 var(--mono)}

/* Course Search & Enroll layout: a sticky filter sidebar beside a results
   list, in the shape university course-search tools commonly use (a
   "Search for courses" panel down the left, results on the right) - our own
   palette throughout, nothing here borrows anyone else's colors. */
.course-search{display:grid;grid-template-columns:264px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.course-search{grid-template-columns:1fr}}
.cs-sidebar{position:sticky;top:88px;background:var(--s2);border:1px solid var(--line);border-radius:13px;overflow:hidden}
@media(max-width:900px){.cs-sidebar{position:static}}
.cs-sidebar-hd{background:linear-gradient(120deg,var(--sig),var(--sig-hi));color:#1B1305;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.cs-sidebar-hd b{font:700 12.5px var(--display);letter-spacing:-.01em}
.cs-reset{background:none;border:0;color:#1B1305;font:600 11px var(--mono);cursor:pointer;text-decoration:underline;
  text-underline-offset:2px;opacity:.82;padding:2px}
.cs-reset:hover{opacity:1}
.cs-sidebar-body{padding:14px}
.cs-field{margin-bottom:13px}
.cs-field label{margin-bottom:5px}
.cs-field:last-of-type{margin-bottom:0}
.cs-search-row{display:flex;gap:6px}
.cs-search-row input{flex:1;min-width:0}
.cs-search-row button{flex:0 0 auto;background:var(--s3);border:1px solid var(--line2);color:var(--dim);
  border-radius:6px;padding:0 11px;cursor:pointer;font-size:13px}
.cs-search-row button:hover{color:var(--sig);border-color:var(--sig)}
.cs-time-row{display:flex;align-items:center;gap:6px}
.cs-time-row input{flex:1;min-width:0}
.cs-check-group{border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.cs-check-group>.k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.cs-check{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;color:var(--tx);cursor:pointer}
.cs-check input{width:auto;accent-color:var(--sig);margin:0}
.cs-results-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cs-results-hd h3{color:var(--tx);text-transform:none;letter-spacing:-.01em;font:700 14px var(--display)}
details.cs-more{border:1px solid var(--line);border-radius:9px;background:var(--s1);padding:2px 11px;margin-top:2px}
details.cs-more>summary{min-height:32px;display:flex;align-items:center;font-size:11.5px;color:var(--dim);cursor:pointer}
details.cs-more[open]>summary{border-bottom:1px solid var(--line);color:var(--tx)}
details.cs-more .cs-field{margin-top:10px}
.section-link{scroll-margin-top:100px}.card,.pane>details,[data-section-title]{scroll-margin-top:88px}
.nav-pulse{animation:navPulse .78s cubic-bezier(.16,1,.3,1)}
@keyframes navPulse{0%{box-shadow:0 0 0 0 rgba(26,115,232,.42)}55%{box-shadow:0 0 0 7px rgba(26,115,232,.10)}100%{box-shadow:var(--shadow-sm)}}

/* Timetable defaults to a readable agenda; the classic grid remains one click away. */
.timetable-controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.timetable-controls>div{min-width:170px}.timetable-controls select{min-width:170px}
.agenda-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.agenda-day{min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--s2);overflow:hidden}
.agenda-day-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--s1) 90%,var(--sig) 10%)}
.agenda-day-head b{font-family:var(--display)}.agenda-day-head span{font:500 9.5px var(--mono);color:var(--faint)}

.status-bump{animation:statusBump .42s cubic-bezier(.16,1,.3,1)}@keyframes statusBump{0%{transform:scale(.99);filter:brightness(.92)}65%{transform:scale(1.006);filter:brightness(1.08)}100%{transform:none;filter:none}}
details.more[open]>*:not(summary){animation:detailIn .28s cubic-bezier(.16,1,.3,1)}@keyframes detailIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
details.more>summary::before{transition:transform .22s,background .22s}details.more[open]>summary::before{transform:rotate(180deg);background:color-mix(in srgb,var(--sigbg) 65%,var(--s2))}

button{isolation:isolate;overflow:hidden}

kbd{display:inline-grid;place-items:center;min-width:20px;min-height:20px;padding:2px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;background:var(--s2);color:var(--dim);font:600 9px var(--mono)}

.command-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.command-head h2{font-size:22px}.command-head .tiny{text-transform:uppercase;letter-spacing:.1em}.command-close{width:40px;height:40px;min-height:40px;border:1px solid var(--line);border-radius:11px;background:var(--s2);color:var(--dim);font-size:22px;cursor:pointer}.command-close:hover{color:var(--tx);border-color:var(--line2)}

  .responsive-table{overflow:visible;border:0;background:transparent}.responsive-table table,.responsive-table thead,.responsive-table tbody,.responsive-table tr,.responsive-table th,.responsive-table td{display:block;width:100%!important}
  .responsive-table thead{position:absolute;width:1px!important;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .responsive-table tbody{display:grid;gap:10px}.responsive-table tr{padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--s2);box-shadow:var(--shadow-sm)}
  .responsive-table td{display:grid;grid-template-columns:minmax(92px,.42fr) minmax(0,1fr);gap:10px;align-items:center;padding:7px 5px;border:0;border-bottom:1px solid var(--line)}
  .responsive-table td:last-child{border-bottom:0}.responsive-table td::before{content:attr(data-label);color:var(--faint);font:600 8.5px var(--mono);letter-spacing:.07em;text-transform:uppercase}
  .responsive-table td[data-label=""]{grid-template-columns:1fr}.responsive-table td[data-label=""]::before{display:none}.responsive-table select,.responsive-table input{width:100%!important}
  /* Picker cards had 10 stacked label:value rows per course (one per column)

     making every course a near-full-screen card. Explicit grid coordinates
     per data-label (not flex-wrap: content-based flex-basis for "Course"
     kept claiming its full text width before the wrap decision, either

  .pick-compact.responsive-table tr{

  .pick-compact.responsive-table td[data-label="Category"],

  .pick-compact.responsive-table td[data-label="Seats"],
